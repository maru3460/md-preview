name: Deploy site to Pages

# サイトだけの変更で走らせる。Rust のビルドとは無関係なので、
# src/ を触っただけでデプロイが動くと待ち時間が無駄になる。
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Cargo.toml' # バージョンをフッタに出しているので、上がったら焼き直す
      - '.github/workflows/pages.yml'
  # PR ではビルドだけ通す（デプロイは main への push のみ）。
  pull_request:
    paths:
      - 'site/**'
      - 'Cargo.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同時に 2 本走らせない。途中で止めると deploy-pages が半端な状態を残すことが
# あるので、待たせて順に流す（actions/deploy-pages の推奨）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
