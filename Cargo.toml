[package]
name = "md-preview"
version = "0.3.0"
edition = "2021"
license = "MIT"
# 単一インスタンス化（#31）が std の File::try_lock（= flock）を使う。安定したのが
# 1.89 なので、古い toolchain では「そんなメソッドは無い」ではなくここで止める。
# これを足したのは依存を 1 つも増やさないため（flock のためだけに libc を直接
# 依存へ入れるのは割に合わない）。
rust-version = "1.89"

[[bin]]
name = "md"
path = "src/main.rs"

# 開発用サーバの中のテスト（起動用の script を差し込む位置）も `cargo test` で回す。
# examples の単体テストは既定では走らない。
[[example]]
name = "serve"
test = true

[dependencies]
# 版を固定するのは、src/webview_delegate.rs が wry のナビゲーションのデリゲートを包み、内線の
# 受け口の名前（`ipc`）を借り、新しい窓を作らないのを wry の UI のデリゲートの既定
# （`new_window_req_handler` が無ければ nil を返す）に任せているため。wry の中身が変わると、
# 包んだ側が黙って食い違う（転送すべき通知が増える、受け口の名前が変わる、窓を作るようになる）。
# 上げるときはあちらを読み直す。
wry = { version = "=0.55.0", features = ["transparent"] }
tao = "0.35"
pulldown-cmark = "0.13"
notify-debouncer-mini = "0.4"
# fsread.rs が open の O_NONBLOCK / O_NOCTTY と fcntl を、git.rs が killpg を使う。
# wry・tao・objc2 が既に引いている版なので、依存ツリーは増えない。
libc = "0.2"

[profile.dev]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
# feature は依存全体で和集合が取られるので、ここに並ぶ大半は tao と wry も要求して
# いる。つまり消してもビルドは通る。それでも platform.rs が使うものを全部書くのは、
# このリストを「何を使っているか」の宣言として読めるようにするため。最小にすると
# ビルドは通るのに使用実態と食い違い、次に触る人が足すべき feature を判断できない。
# default を切らないと objc2-app-kit の default(ほぼ全クラス)に乗ってしまい、
# 何を書いても結果が変わらない。
#
# objc2 の exception は、内線の受け口の登録で ObjC の例外を受けるため（webview_delegate.rs）。
# wry が既に有効にしている feature なので、依存ツリーは増えない。
objc2 = { version = "0.6", default-features = false, features = ["std", "exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    # NSRunningApplication の pid 系メソッドが libc::pid_t を受け渡しする
    "libc",
    "NSAppearance", "NSApplication", "NSEvent", "NSImage", "NSMenu",
    "NSMenuItem", "NSPasteboard", "NSRunningApplication", "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSData", "NSString",
    # 移動と内線の送り元の URL を読む（webview_delegate.rs）。
    "NSURL", "NSURLRequest",
    # 全画面から抜け終わった合図（NSWindowDidExitFullScreenNotification）を受けるため。
    # addObserverForName:object:queue:usingBlock: は NSOperation と block2 も要求する。
    "NSNotification", "NSOperation", "block2",
] }
# WebKit の先読みを機能フラグで切る（platform.rs の without_prefetch）。webview を作る前の
# configuration を自分で組んで wry に渡すため。wry が既に引いている版（0.3.2）なので、
# 依存ツリーは増えない。
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std", "WKPreferences", "WKWebViewConfiguration",
    # 移動の判定と内線の受け口を自分で持つ（webview_delegate.rs）。デリゲートの
    # メソッドは block2 と objc2-app-kit の feature も揃わないと生えない。
    "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKNavigationResponse",
    "WKWebpagePreferences", "WKFrameInfo", "WKScriptMessage", "WKScriptMessageHandler",
    "WKUserContentController", "WKWebView", "block2", "objc2-app-kit",
] }
# 上の通知をブロックで受けるためだけに要る。wry と objc2-foundation が既に引いて
# いるので依存ツリーは増えない（Cargo.lock の block2 0.6.2 と同じもの）。
block2 = "0.6"

# WebKit の機能フラグを、メインスレッドで確かめる（理由は tests/webkit_flags.rs の冒頭）。
[[test]]
name = "webkit_flags"
harness = false
