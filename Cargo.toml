[package]
name = "md-preview"
version = "0.1.5"
edition = "2021"

[[bin]]
name = "md"
path = "src/main.rs"

[dependencies]
wry = "0.55"
tao = "0.35"
pulldown-cmark = "0.13"

[profile.dev]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace", "NSRunningApplication",
    "NSApplication", "NSMenu", "NSMenuItem", "NSEvent",
] }
objc2-foundation = "0.3"
