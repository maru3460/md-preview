[package]
name = "md-preview"
version = "0.1.20"
edition = "2021"
license = "MIT"
# 単一インスタンス化（#31）が std の File::try_lock（= flock）を使う。安定したのが
# 1.89 なので、古い toolchain では「そんなメソッドは無い」ではなくここで止める。
# これを足したのは依存を 1 つも増やさないため（flock のためだけに libc を直接
# 依存へ入れるのは割に合わない）。
rust-version = "1.89"

[[bin]]
name = "md"
path = "src/main.rs"

[dependencies]
wry = { version = "0.55", features = ["transparent"] }
tao = "0.35"
pulldown-cmark = "0.13"
notify-debouncer-mini = "0.4"

[profile.dev]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
# feature は依存全体で和集合が取られるので、ここに並ぶ大半は tao と wry も要求して
# いる。つまり消してもビルドは通る。それでも platform.rs が使うものを全部書くのは、
# このリストを「何を使っているか」の宣言として読めるようにするため。最小にすると
# ビルドは通るのに使用実態と食い違い、次に触る人が足すべき feature を判断できない。
# default を切らないと objc2-app-kit の default(ほぼ全クラス)に乗ってしまい、
# 何を書いても結果が変わらない。
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    # NSRunningApplication の pid 系メソッドが libc::pid_t を受け渡しする
    "libc",
    "NSAppearance", "NSApplication", "NSEvent", "NSImage", "NSMenu",
    "NSMenuItem", "NSPasteboard", "NSRunningApplication", "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSData", "NSString",
    # 全画面から抜け終わった合図（NSWindowDidExitFullScreenNotification）を受けるため。
    # addObserverForName:object:queue:usingBlock: は NSOperation と block2 も要求する。
    "NSNotification", "NSOperation", "block2",
] }
# 上の通知をブロックで受けるためだけに要る。wry と objc2-foundation が既に引いて
# いるので依存ツリーは増えない（Cargo.lock の block2 0.6.2 と同じもの）。
block2 = "0.6"
